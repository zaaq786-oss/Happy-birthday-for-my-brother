<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 450px;
      margin: 20px;
    }
    h1 { font-size: 2.2rem; color: #f59e0b; margin-bottom: 0.5rem; }
    p { font-size: 1.1rem; line-height: 1.6; color: #d1d5db; }
    .badge {
      display: inline-block;
      background: #3b82f6;
      color: white;
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🇵🇹 Greetings in Portugal!</div>
    <h1>Happy Birthday! 🎉</h1>
    <p>You might be exploring Portugal on your own today, but you're definitely not alone. Wishing you the absolute best year ahead—eat some great food, take in the views, and get ready for a proper celebration when you get back!</p>
  </div>
</body>
</html>
